# Vale para o mock sempre que ele roda com streamlit run painel_mensal/app.py, sem depender de
# flag na linha de comando: a base tem dados de vítimas, então o servidor fica só em localhost e
# não envia estatísticas de uso.
[server]
address = "localhost"

[browser]
gatherUsageStats = false

# sem a barra de ferramentas do Streamlit (botão Deploy)
[client]
toolbarMode = "minimal"

# destaque dos controles (caixas de seleção, trilho do período, pílulas, botões e abas) em violeta, no lugar
# do vermelho padrão: vermelho e azul ficam para o SHAP nas visões de explicação, e nenhum gráfico usa
# violeta; o tema claro é o das capturas
[theme]
base = "light"
primaryColor = "#6d28d9"
